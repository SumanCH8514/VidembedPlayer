<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VidEmbed Player</title>
  <link rel="icon" type="image/png" href="/assets/img/fav.png" />
  <link rel="apple-touch-icon" href="/assets/img/fav.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg-color: #06080e;
      --accent-color: #6366f1;
      --text-color: #f8fafc;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    #embed-stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    movi-player {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }

    .embed-alert {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: rgba(6, 8, 14, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .embed-alert.visible {
      display: flex;
    }
    .embed-alert-card {
      max-width: 440px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }
    .embed-alert-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }
    .embed-alert-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #fff;
    }
    .embed-alert-desc {
      font-size: 13px;
      line-height: 1.5;
      color: #94a3b8;
      margin-bottom: 16px;
    }
    .embed-alert-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      background: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    .embed-alert-btn:hover {
      background: #4f46e5;
    }
  </style>
</head>
<body>
  <div id="embed-stage">
    <movi-player
      id="vidembed-player"
      renderer="canvas"
      playsinline
      fastseek
      objectfit="control"
      poster="/assets/img/image.png"
      wasmurl="/movi.wasm"
    ></movi-player>


    <div class="embed-alert" id="embed-alert">
      <div class="embed-alert-card">
        <div class="embed-alert-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <div class="embed-alert-title" id="embed-alert-title">Playback Encountered an Issue</div>
        <div class="embed-alert-desc" id="embed-alert-desc">Unable to load the requested video stream. Verify the video URL and check CORS configuration.</div>
        <button class="embed-alert-btn" id="embed-alert-retry">Retry Playback</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/embed.ts"></script>
</body>
</html>
